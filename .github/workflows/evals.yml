name: Hero Evals

# Two layers:
#   hero-specs (offline)     — lint the case specs + grader self-test. No secrets, no
#                              spend. Runs on every push/PR.
#   hero-evals-live (Codex)  — runs the FULL real hero suite through real Codex: installs
#                              the Krea plugin (skills + MCP), drives `codex exec`, and
#                              grades each transcript. Spends real OpenAI (Codex) + Krea +
#                              Anthropic (judge) credits (~1-1.5h), so it is gated.
#
# The live suite runs when the thing it tests changes:
#   - push to main touching a packaged skill or the MCP config (.codex-plugin/.mcp.json)
#   - repository_dispatch `mcp-changed` (fired by krea-ai/app when the MCP server changes)
#   - manual "Run workflow" (workflow_dispatch), or a `run-hero-live` PR label
#
# Default suite = the real multi-turn creative cases (HC-01..06, 09..13, incl. animation +
# multistep chains). The safety-refusal case (HC-08) is kept but runs only on demand via `only`.

on:
  push:
    branches: [main]
    paths:
      - "evals/hero/**"
      - "krea-generate/**"
      - "krea-marketing/**"
      - "krea-motion/**"
      - "product-packaging-design/**"
      - ".codex-plugin/.mcp.json"
  pull_request:
    types: [opened, synchronize, reopened, labeled]
  workflow_dispatch:
    inputs:
      only:
        description: "Space-separated case ids (blank = full real suite HC-01..06,09..13)"
        required: false
        default: ""
  repository_dispatch:
    types: [mcp-changed]

permissions:
  contents: read

concurrency:
  group: hero-evals-${{ github.ref }}-${{ github.event_name }}
  cancel-in-progress: false

jobs:
  # ── Offline gate: spec lint + grader self-test (no secrets, no spend) ────────
  hero-specs:
    if: github.event_name == 'push' || github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Lint hero case specs
        run: python evals/hero/run.py --lint
      - name: Grader self-test (no API, no secrets)
        run: python evals/hero/run.py --selftest

  # ── Decide whether the (expensive) live suite should run ─────────────────────
  live-gate:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      run: ${{ steps.decide.outputs.run }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - id: decide
        run: |
          run=false
          case "${{ github.event_name }}" in
            workflow_dispatch|repository_dispatch)
              run=true ;;
            pull_request)
              if [ "${{ github.event.action }}" = "labeled" ] && \
                 [ "${{ github.event.label.name }}" = "run-hero-live" ]; then run=true; fi ;;
            push)
              BASE="${{ github.event.before }}"
              git cat-file -e "${BASE}^{commit}" 2>/dev/null || BASE="HEAD~1"
              if git diff --name-only "$BASE" HEAD | \
                 grep -qE '^(krea-generate|krea-marketing|krea-motion|product-packaging-design)/|^\.codex-plugin/\.mcp\.json$'; then
                run=true
              fi ;;
          esac
          echo "run=$run" >> "$GITHUB_OUTPUT"
          echo "live suite will run: $run"

  # ── Live suite on real Codex (gated by live-gate) ────────────────────────────
  hero-evals-live:
    needs: live-gate
    if: needs.live-gate.outputs.run == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 240  # raised for the longer multi-turn chains (HC-12/13) + animation video
    env:
      OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
      KREA_API_KEY: ${{ secrets.KREA_API_KEY }}
      ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
      HERO_ONLY: ${{ github.event.inputs.only }}
      CI: "1"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Install Codex CLI
        run: |
          npm install -g @openai/codex
          codex --version

      - name: Install Claude CLI (LLM judge)
        run: |
          npm install -g @anthropic-ai/claude-code
          claude --version

      - name: Authenticate Codex (API key, non-interactive)
        run: |
          printenv OPENAI_API_KEY | codex login --with-api-key
          codex login status

      - name: Install the Krea plugin (skills + bearer MCP)
        run: |
          # Installs the plugin so `codex exec` loads the Krea skills, with a
          # bearer-token MCP variant (the shipped one is OAuth / interactive).
          bash evals/hero/install-codex-plugin.sh
          codex plugin list | grep -i krea-local -A1 || true

      - name: Run hero suite on Codex
        run: |
          # --run-suite runs the cases (and their variants) in parallel under one
          # global concurrency cap; per-turn timeout + the job timeout bound it.
          mkdir -p evals/hero/runs
          python evals/hero/run.py \
            --run-suite "${HERO_ONLY:-HC-01 HC-02 HC-03 HC-04 HC-05 HC-06 HC-09 HC-10 HC-11 HC-12 HC-13}" \
            --judge --concurrency 4 --out-dir evals/hero/runs || true

      - name: Summary
        if: always()
        run: |
          echo "## Hero suite (live Codex)" >> "$GITHUB_STEP_SUMMARY"
          for f in evals/hero/runs/HC-*.json; do
            [ -f "$f" ] || continue
            v=$(jq -c '[.results[] | {v: .verdict, t: .total_latency_s}]' "$f" 2>/dev/null || echo '["parse-error"]')
            echo "- \`$(basename "$f" .json)\` -> $v" | tee -a "$GITHUB_STEP_SUMMARY"
          done

      # Posts the run summary to NOTIFY_WEBHOOK_URL (an incoming-webhook secret).
      # No-ops cleanly when the secret is unset, so it never fails the job.
      - name: Post results to feedback webhook
        if: always()
        env:
          NOTIFY_WEBHOOK_URL: ${{ secrets.NOTIFY_WEBHOOK_URL }}
        run: |
          python evals/hero/run.py --summarize evals/hero/runs > evals/hero/runs/summary.json
          python evals/hero/notify.py \
            --summary evals/hero/runs/summary.json \
            --run-url "https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }}" \
            --repo "${{ github.repository }}" \
            --ref "${{ github.sha }}" \
            --trigger "${{ github.event_name }}" \
            --reason "${{ github.event.inputs.only }}"

      # This is a public repo, so the artifact is results-only: drop the raw
      # transcripts (kept locally for debugging, not published).
      - name: Strip transcripts (results-only artifact)
        if: always()
        run: |
          for f in evals/hero/runs/HC-*.json; do
            [ -f "$f" ] || continue
            python3 -c "import json,sys; p=sys.argv[1]; d=json.load(open(p)); [r.pop('transcript',None) for r in d.get('results',[])]; json.dump(d,open(p,'w'),indent=2)" "$f"
          done

      - name: Upload results (verdicts + summaries)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: hero-live-${{ github.run_id }}
          path: evals/hero/runs/**
          retention-days: 14
          if-no-files-found: warn
