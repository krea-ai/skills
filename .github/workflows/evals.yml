name: Hero Evals (offline)

# The hero-eval LOOP runs in Codex with @plugin-eval (where the Krea MCP + skills
# load natively). CI here is intentionally offline + secret-free: it only lints
# the hero case specs and runs the transcript-grader self-test. Nothing here
# drives a live agent or touches Krea/Anthropic credentials, so it's safe on a
# public repo and on PRs from forks.
#
# See evals/hero/README.md for the in-Codex run + grading flow.

on:
  push:
    branches: [main]
    paths: ["evals/hero/**"]
  pull_request:
    paths: ["evals/hero/**"]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  hero-specs:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Lint hero case specs
        run: python evals/hero/run.py --lint
      - name: Grader self-test (no API, no secrets)
        run: python evals/hero/run.py --selftest
