name: Hero Evals

# Two layers:
#   hero-specs (offline)     — lint the case specs + grader self-test. No secrets,
#                              no spend. Runs on every push/PR touching evals/hero.
#   hero-evals-live (Codex)  — runs the FULL hero suite through real Codex
#                              (`codex exec` against the connected Krea MCP) and
#                              grades each transcript. Spends real OpenAI (Codex) +
#                              Krea + Anthropic (judge) credits, so it is gated to
#                              manual dispatch or a `run-hero-live` PR label.
#
# Trigger the live suite:
#   - Actions tab -> "Hero Evals" -> Run workflow  (workflow_dispatch), or
#   - add the `run-hero-live` label to a PR.
#
# NOTE: real-Codex generation cases take ~1h each, so the live default runs a small
# representative set (HC-04 generate + HC-07 no-invoke + HC-08 safety). Use the `only`
# input to run others (e.g. HC-03/05/06). HC-01/02/09/10 still point at placeholder
# asset URLs and FAIL/ERROR until their review-account assets are provisioned.

on:
  push:
    branches: [main]
    paths: ["evals/hero/**"]
  pull_request:
    types: [opened, synchronize, reopened, labeled]
  workflow_dispatch:
    inputs:
      only:
        description: "Space-separated case ids (blank = representative set HC-04 HC-07 HC-08)"
        required: false
        default: ""

permissions:
  contents: read

concurrency:
  group: hero-evals-${{ github.ref }}-${{ github.event_name }}
  cancel-in-progress: false

jobs:
  # ── Offline gate: spec lint + grader self-test (no secrets, no spend) ────────
  hero-specs:
    if: github.event_name == 'push' || github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Lint hero case specs
        run: python evals/hero/run.py --lint
      - name: Grader self-test (no API, no secrets)
        run: python evals/hero/run.py --selftest

  # ── Live suite on real Codex (manual dispatch or `run-hero-live` PR label) ───
  hero-evals-live:
    if: >
      github.event_name == 'workflow_dispatch' ||
      (github.event_name == 'pull_request' && github.event.action == 'labeled' &&
       github.event.label.name == 'run-hero-live')
    runs-on: ubuntu-latest
    timeout-minutes: 180
    env:
      OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
      KREA_API_KEY: ${{ secrets.KREA_API_KEY }}
      ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
      HERO_ONLY: ${{ github.event.inputs.only }}
      CI: "1"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Install Codex CLI
        run: |
          npm install -g @openai/codex
          codex --version

      - name: Authenticate Codex (API key, non-interactive)
        run: |
          printenv OPENAI_API_KEY | codex login --with-api-key
          codex login status

      - name: Install the Krea plugin (skills + bearer MCP)
        run: |
          # Installs the plugin so `codex exec` loads the Krea skills, with a
          # bearer-token MCP variant (the shipped one is OAuth / interactive).
          bash evals/hero/install-codex-plugin.sh
          codex plugin list | grep -i krea-local -A1 || true

      - name: Run hero suite on Codex
        run: |
          set +e
          ids="${HERO_ONLY:-HC-04 HC-07 HC-08}"
          mkdir -p evals/hero/runs
          for c in $ids; do
            echo "::group::$c"
            timeout -k 60 3000 python evals/hero/run.py --run-codex "$c" --judge | tee "evals/hero/runs/$c.json"
            rc=${PIPESTATUS[0]}
            [ "$rc" -ne 0 ] && echo "(case $c: exit $rc — timed out or graded FAIL/ERROR)"
            echo "::endgroup::"
          done

      - name: Summary
        if: always()
        run: |
          echo "## Hero suite (live Codex)" >> "$GITHUB_STEP_SUMMARY"
          for f in evals/hero/runs/HC-*.json; do
            [ -f "$f" ] || continue
            v=$(jq -c '[.results[] | {v: .verdict, t: .total_latency_s}]' "$f" 2>/dev/null || echo '["parse-error"]')
            echo "- \`$(basename "$f" .json)\` -> $v" | tee -a "$GITHUB_STEP_SUMMARY"
          done

      # Posts the run summary to NOTIFY_WEBHOOK_URL (an incoming-webhook secret).
      # No-ops cleanly when the secret is unset, so it never fails the job.
      - name: Post results to feedback webhook
        if: always()
        env:
          NOTIFY_WEBHOOK_URL: ${{ secrets.NOTIFY_WEBHOOK_URL }}
        run: |
          python evals/hero/run.py --summarize evals/hero/runs > evals/hero/runs/summary.json
          python evals/hero/notify.py \
            --summary evals/hero/runs/summary.json \
            --run-url "https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }}" \
            --trigger "${{ github.event_name }}" \
            --reason "${{ github.event.inputs.only }}"

      - name: Upload transcripts + verdicts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: hero-live-${{ github.run_id }}
          path: evals/hero/runs/**
          retention-days: 14
          if-no-files-found: warn
