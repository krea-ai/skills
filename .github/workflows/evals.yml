name: Hero Evals

# Hero-eval layer (evals/hero/). Drives each hero case through a headless
# `claude -p` agent loop with the checked-out skills loaded, captures the tool
# path, and grades it (deterministic gates + LLM judge).
#
# This is separate from validate.yml (lint/version) and claude.yml (PR review),
# and from the regex smoke suite (evals/run.sh), none of which are touched.
#
# PUBLIC-REPO SAFETY / WHO CAN TRIGGER
# The secret-bearing suite runs ONLY on push to main + manual dispatch — both
# require repo WRITE access, so only internal collaborators can trigger it. It
# also targets the `evals` GitHub Environment: a repo admin should add required
# reviewers (the internal team) and a main-only deployment-branch policy there
# to enforce internal-only approval before secrets are exposed. Pull requests
# run an OFFLINE, secret-free self-test only.

on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      only:
        description: "Comma-separated hero case ids to run (blank = all)"
        required: false
        type: string
      model:
        description: "Harness model (agent under test)"
        required: false
        default: "claude-sonnet-4-6"
        type: string
  pull_request:
    # Offline, secret-free self-test only (see hero-evals-pr-offline).
    types: [opened, synchronize, reopened]

# Serialize: the demo Krea account + API quota are shared across runs.
concurrency:
  group: hero-evals-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  # ── Full suite: push to main + manual dispatch (internal write-access only) ──
  hero-evals:
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 45
    # Gate: add required reviewers (internal team) + main-only branch policy to
    # this environment in repo settings to enforce internal-only approval.
    environment: evals
    env:
      ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
      KREA_API_KEY: ${{ secrets.KREA_API_KEY }}
      NOTIFY_WEBHOOK_URL: ${{ secrets.NOTIFY_WEBHOOK_URL }}
      HERO_MODEL: ${{ github.event.inputs.model || 'claude-sonnet-4-6' }}
      HERO_JUDGE_MODEL: "claude-haiku-4-5-20251001"
      HERO_ONLY: ${{ github.event.inputs.only || '' }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Install Claude Code CLI
        run: |
          npm install -g @anthropic-ai/claude-code
          claude --version

      - name: Install Krea CLI
        run: |
          npm install -g @krea-ai/cli
          krea --version

      - name: Verify Krea auth (fail loudly if KREA_API_KEY is missing)
        run: |
          if [ -z "$KREA_API_KEY" ]; then
            echo "::error::KREA_API_KEY is empty — the real-generation cases cannot run."
            exit 1
          fi
          krea doctor || echo "::warning::krea doctor non-zero; running in KEY-only mode"

      - name: Self-test the runner (offline)
        run: python evals/hero/run.py --selftest

      - name: Run hero evals
        id: run
        continue-on-error: true
        run: |
          python evals/hero/run.py \
            --judge \
            --model "$HERO_MODEL" \
            --judge-model "$HERO_JUDGE_MODEL" \
            ${HERO_ONLY:+--only "$HERO_ONLY"} \
            --out evals/hero/runs \
            --json-summary evals/hero/runs/latest-summary.json

      - name: Upload run results (results only — no raw transcripts)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: hero-eval-results-${{ github.run_id }}
          # Public repo: publish ONLY the graded results (allowlist). Raw
          # transcripts / prompts / final answers / stderr are never uploaded.
          # The pass/fail summary is also sent to the notify webhook.
          path: |
            evals/hero/runs/latest-summary.json
            evals/hero/runs/history.jsonl
            evals/hero/runs/**/summary.json
            evals/hero/runs/**/verdict.json
            evals/hero/runs/**/tool_path.json
          retention-days: 14
          if-no-files-found: warn

      - name: Post run summary
        if: always()
        run: |
          python evals/hero/notify.py \
            --summary evals/hero/runs/latest-summary.json \
            --run-url "${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}" \
            --trigger "${{ github.event_name }}" \
            --outcome "${{ steps.run.outcome }}"

      - name: Reflect eval result in job status
        if: always()
        run: test "${{ steps.run.outcome }}" = "success"

  # ── Pull-request check: OFFLINE, secret-free (safe on a public repo) ────────
  # Runs the parser/verifier self-test — no API calls, no secrets, nothing to
  # exfiltrate even though it runs PR code. The real suite runs on push to main.
  hero-evals-pr-offline:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Offline self-test (no API, no secrets)
        run: python evals/hero/run.py --selftest
