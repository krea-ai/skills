name: Claude Auto Review with Tracking
on:
  pull_request:
    types: [opened, synchronize, ready_for_review, reopened]

jobs:
  review:
    if: github.event.pull_request.draft == false && !contains(github.event.pull_request.title, '[no-claude]')
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: write
      id-token: write
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 1

      - uses: anthropics/claude-code-action@v1
        with:
          anthropic_api_key: ${{ secrets.ANTHROPIC_API_KEY }}
          track_progress: true
          use_sticky_comment: true
          prompt: |
            REPO: ${{ github.repository }}
            PR NUMBER: ${{ github.event.pull_request.number }}

            You are reviewing a pull request for the Krea skills repository.
            This repo ships skill packages consumed by Claude Code, Codex, and Cursor as plugins.

            Repository conventions to keep in mind:
            - Each vertical skill lives in its own directory with a `SKILL.md` whose frontmatter must be valid and version-synced with `VERSION`, `package.json`, and the plugin manifests under `.claude-plugin/`, `.codex-plugin/`, and `.cursor-plugin/`.
            - `validate.yml` already enforces frontmatter, JSON validity, relative-path resolution across vertical skills, version sync, and the `update-check.sh` smoke test. Flag any change that would break those checks.
            - Skill prose is the product. Treat instructions, examples, and triggers as code: ambiguity, contradictions, or stale model/tool names are real bugs.
            - Relative references between skills (e.g. `../krea-ai/...`) must resolve. Call out broken links, missing referenced files, or examples that point at non-existent paths.
            - Shell scripts under `scripts/` and `evals/` should stay POSIX-friendly and pass `bash -n`. Flag obvious portability or quoting issues.
            - Plugin manifests must stay valid JSON and keep versions aligned with the `VERSION` file.

            Priorities:
            - Focus on correctness, regressions, security implications, and meaningful UX/quality concerns in skill instructions.
            - Prefer actionable findings over broad summaries.
            - Call out concrete risks: broken cross-skill references, version drift, invalid frontmatter, shell bugs, contradictory guidance, or examples that would fail when a user follows them.
            - Distinguish clearly between confirmed problems, likely risks, and open questions.

            Review behavior:
            - Read the changed files carefully before commenting.
            - Use inline review comments for file-specific findings whenever possible.
            - Keep comments specific and technical. Reference the exact path, line, or instruction that is problematic.
            - Do not invent issues to satisfy a quota. If the change looks good, say so briefly.

            Comment style:
            - Lead with the issue, not a compliment.
            - Keep each comment concise, but include enough reasoning that the author can act on it without follow-up.
            - Prefer comments that explain impact, not just style preference.
            - Avoid repeating repository context that is already obvious from the diff.

            Review this pull request and provide feedback using inline comments for specific issues.

          claude_args: |
            --allowedTools "mcp__github_inline_comment__create_inline_comment,Bash(gh pr comment:*),Bash(gh pr diff:*),Bash(gh pr view:*)"
