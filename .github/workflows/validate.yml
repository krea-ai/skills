name: Validate Skills

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Validate skill frontmatter
        run: |
          bash scripts/validate-skill-frontmatter.sh \
            krea-animation/SKILL.md \
            krea-generate/SKILL.md \
            krea-marketing/SKILL.md \
            product-photography/SKILL.md \
            wip/krea-build/SKILL.md

      - name: Validate plugin manifest JSON
        run: |
          for f in .claude-plugin/*.json .codex-plugin/*.json .cursor-plugin/*.json; do
            jq -e . "$f" >/dev/null || { echo "::error::Invalid JSON: $f"; exit 1; }
            echo "OK $f"
          done

      - name: Check Krea doc references
        run: bash scripts/check-krea-doc-refs.sh

      - name: Check package contents
        run: python3 scripts/check-package-contents.py

      - name: Smoke-test animation MCP helper scripts
        run: |
          set -euo pipefail
          project="$(mktemp -d)"
          python3 krea-animation/scripts/scaffold_project.py --project "$project" --title "Smoke" --runtime 4
          python3 - "$project" <<'PY'
          from pathlib import Path
          import sys

          project = Path(sys.argv[1])
          shot = project / "03_shots/SC001/SH010/shot.md"
          text = shot.read_text(encoding="utf-8")
          replacements = {
              "Status: draft": "Status: approved_for_video",
              "Start image:": "Start image: https://krea.ai/assets/start.png",
              "Reference images:": "Reference images: https://krea.ai/assets/ref.png",
              "Prompt:": "Prompt: A simple camera push across the approved keyframe.",
          }
          for old, new in replacements.items():
              text = text.replace(old, new)
          shot.write_text(text, encoding="utf-8")
          PY
          python3 krea-animation/scripts/validate_project.py "$project"
          python3 krea-animation/scripts/build_manifests.py "$project"
          python3 krea-animation/scripts/submit_video_jobs.py "$project" --dry-run --model bytedance/seedance-2-fast
          test "$(wc -l < "$project/04_generation/jobs/mcp-video-jobs.jsonl")" -eq 1
          python3 - "$project/04_generation/jobs/mcp-video-jobs.jsonl" <<'PY'
          import json
          from pathlib import Path
          import sys

          payloads = [json.loads(line) for line in Path(sys.argv[1]).read_text(encoding="utf-8").splitlines()]
          assert len(payloads) == 1
          assert payloads[0]["model"] == "bytedance/seedance-2-fast"
          assert payloads[0]["input"]["start_image"] == "https://krea.ai/assets/start.png"
          PY
          python3 - "$project/04_generation/manifests/video_jobs.csv" <<'PY'
          import csv
          from pathlib import Path
          import sys

          path = Path(sys.argv[1])
          with path.open(newline="", encoding="utf-8") as handle:
              rows = list(csv.DictReader(handle))
          rows[0]["model"] = "bytedance/seedance-2-fast"
          with path.open("w", newline="", encoding="utf-8") as handle:
              writer = csv.DictWriter(handle, fieldnames=rows[0].keys())
              writer.writeheader()
              writer.writerows(rows)
          PY
          python3 krea-animation/scripts/submit_video_jobs.py "$project" --dry-run
          printf 'SC001_SH010\tjob_123\tsubmitted\n' > "$project/04_generation/jobs/jobs.tsv"
          cat > "$project/04_generation/jobs/mcp-results.jsonl" <<'JSONL'
          {"jobId":"job_123","status":"completed","result":{"urls":["https://example.invalid/clip.mp4"]}}
          JSONL
          python3 krea-animation/scripts/poll_video_jobs.py "$project" --results-jsonl "$project/04_generation/jobs/mcp-results.jsonl"
          results="$project/04_generation/jobs/results.tsv"
          test "$(wc -l < "$results")" -eq 1
          grep -qx $'SC001_SH010\tcompleted\thttps://example.invalid/clip.mp4' "$results"
          ! grep -q $'\tpending\t' "$results"
          cat > "$project/04_generation/jobs/mcp-results.jsonl" <<'JSONL'
          {"jobId":"job_123","status":"completed","result":{}}
          JSONL
          python3 krea-animation/scripts/poll_video_jobs.py "$project" --results-jsonl "$project/04_generation/jobs/mcp-results.jsonl"
          grep -qx $'SC001_SH010\tfailed\tcompleted without result URL' "$results"
          echo "OK animation MCP helpers"

      - name: Smoke-test eval runner syntax
        run: |
          bash -n evals/run.sh
          echo "OK evals/run.sh syntax"

      - name: Enforce VERSION sync across all declaration sites
        run: |
          VERSION="$(tr -d '[:space:]' < VERSION)"
          if ! echo "$VERSION" | grep -qE '^[0-9]+\.[0-9]+\.[0-9]+$'; then
            echo "::error::VERSION file is not semver: $VERSION"
            exit 1
          fi
          fail=0
          check() {
            local label="$1" expected="$2" actual="$3"
            if [ "$actual" != "$expected" ]; then
              echo "::error::Version drift in $label: expected $expected, got $actual"
              fail=1
            else
              echo "OK $label = $actual"
            fi
          }
          check "package.json"                    "$VERSION" "$(jq -r .version package.json)"
          check "krea-animation/SKILL.md"         "$VERSION" "$(awk '/^version:/ {print $2; exit}' krea-animation/SKILL.md)"
          check "krea-generate/SKILL.md"          "$VERSION" "$(awk '/^version:/ {print $2; exit}' krea-generate/SKILL.md)"
          check "krea-generate/VERSION"           "$VERSION" "$(tr -d '[:space:]' < krea-generate/VERSION)"
          check "krea-marketing/SKILL.md"         "$VERSION" "$(awk '/^version:/ {print $2; exit}' krea-marketing/SKILL.md)"
          check "product-photography/SKILL.md"    "$VERSION" "$(awk '/^version:/ {print $2; exit}' product-photography/SKILL.md)"
          check "wip/krea-build/SKILL.md"         "$VERSION" "$(awk '/^version:/ {print $2; exit}' wip/krea-build/SKILL.md)"
          check ".claude-plugin/plugin.json"      "$VERSION" "$(jq -r .version .claude-plugin/plugin.json)"
          check ".claude-plugin/marketplace.json" "$VERSION" "$(jq -r '.plugins[0].version' .claude-plugin/marketplace.json)"
          check ".codex-plugin/plugin.json"       "$VERSION" "$(jq -r .version .codex-plugin/plugin.json)"
          check ".cursor-plugin/plugin.json"      "$VERSION" "$(jq -r .version .cursor-plugin/plugin.json)"
          exit $fail

      - name: Smoke-test update-check script
        run: |
          chmod +x scripts/update-check.sh
          chmod +x krea-generate/scripts/update-check.sh
          SKILLS_STATE=/tmp/krea-skills-test bash scripts/update-check.sh
          test -f /tmp/krea-skills-test/last-update-check
          SKILLS_STATE=/tmp/krea-skills-test-embedded bash krea-generate/scripts/update-check.sh
          test -f /tmp/krea-skills-test-embedded/last-update-check
          echo "OK update-check.sh wrote cache files"
